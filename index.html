<script>
/* Esporta/Importa TUTTO: unisce i dati di tutte e tre le app in un unico file JSON */
const OWN_KEY='fincasa',OWN_GET=()=>S,ALLKEYS={fincasa:'Finanze casa',fondospese:'Fondo spese',simBollette_v1:'Simulatore bollette'};
async function exportAll(){
 const out={tipo:'backup-completo',esportato:new Date().toISOString(),dati:{}},mancanti=[];
 for(const k in ALLKEYS){let v=null;
  if(k===OWN_KEY)v=OWN_GET();else{try{v=JSON.parse(localStorage.getItem(k))}catch(e){}}
  if(v)out.dati[k]=v;else mancanti.push(ALLKEYS[k])}
 const ok=await saveJson(JSON.stringify(out,null,2),'backup-completo.json');
 if(ok&&mancanti.length)alert('Backup salvato, ma non ho trovato i dati di: '+mancanti.join(', ')+'.\nSe le app sono in cartelle/indirizzi diversi, il browser le tiene separate: apri ognuna ed esporta da lì.')}
function importAll(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
 i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{
  const j=JSON.parse(t);if(!j.dati)throw 0;const ks=Object.keys(j.dati).filter(k=>k in ALLKEYS);if(!ks.length)throw 0;
  if(!confirm('Ripristinare: '+ks.map(k=>ALLKEYS[k]).join(', ')+'?\nI dati attuali di queste app verranno sostituiti.'))return;
  ks.forEach(k=>localStorage.setItem(k,JSON.stringify(j.dati[k])));location.reload()
 }catch(e){alert('File di backup completo non valido')}})};i.click()}
/* Salva JSON dove vuoi: finestra "Salva con nome" (Chrome/Edge/Opera), altrimenti download classico */
async function saveJson(text,name){
 if(window.showSaveFilePicker){
  try{const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'File JSON',accept:{'application/json':['.json']}}]});
   const w=await h.createWritable();await w.write(text);await w.close();return true}
  catch(e){if(e&&e.name==='AbortError')return false}
 }
 const u=URL.createObjectURL(new Blob([text],{type:'application/json'})),l=document.createElement('a');
 l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return true}
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const $=s=>document.querySelector(s);

...['Benzina','Spesa','Saponi','Cane','Farmacia','Svago','Assicurazione','Extra'].map(n=>({n,g:VAR})),
...['Stipendio','Rimborsi e contributi','Altre entrate'].map(n=>({n,g:INC})),{n:EXN,g:EXC}],

['TRASFERIMENTO PER MUTUO','Mutuo'],['CANONE DI LOCAZIONE','Affitto'],['TARI','TARI'],['RIFIUTI','TARI'],['CONDOMIN','Condominio'],['AMMINISTRAZIONE CONDOM','Condominio'],
['STAZIONE SERVIZIO','Benzina'],['ENI5','Benzina'],['Q8','Benzina'],['TAMOIL','Benzina'],['ESSO','Benzina'],['IP STATION','Benzina'],
['ESSELUNGA','Spesa'],['UNICOOP','Spesa'],['LIDL','Spesa'],['CADDY','Spesa'],['CONAD','Spesa'],['CARREFOUR','Spesa'],['COOP','Spesa'],
['BOTTEGA VERDE','Saponi'],['DOUGLAS','Saponi'],['SEPHORA','Saponi'],['TIGOTA','Saponi'],['ACQUA E SAPONE','Saponi'],
['6334 PET','Cane'],['VETAR','Cane'],['CADIVET','Cane'],['VETERIN','Cane'],['ZOOPLUS','Cane'],['ARCAPLANET','Cane'],['MAXI ZOO','Cane'],
['FARMACIA','Farmacia'],['PARAFARMACIA','Farmacia'],
['DELIVEROO','Svago'],['BURGER KING','Svago'],['KEBAB','Svago'],['MR WU','Svago'],['CHIANTINVISTA','Svago'],['BAR IL CHIOSTRO','Svago'],['CASA GIOIA','Svago'],['NETFLIX','Svago'],['SPOTIFY','Svago'],['CINEMA','Svago'],
['ASSICUR','Assicurazione'],['UNIPOL','Assicurazione'],['GENERALI','Assicurazione'],['ALLIANZ','Assicurazione'],['DIRECT LINE','Assicurazione'],['LINEAR','Assicurazione']
].map(([k,c])=>({k,c,s:'-'})).concat([['EMOLUMENTI','Stipendio'],['STIPENDIO','Stipendio'],['AGOSTINI AMBRA','Rimborsi e contributi'],['AMBRA AGOSTINI','Rimborsi e contributi'],['RIMBORSO','Rimborsi e contributi']].map(([k,c])=>({k,c,s:'+'})))});
let S=(()=>{try{const j=JSON.parse(localStorage.getItem('fincasa'));if(j&&j.tx)return j}catch(e){}return DEF()})();
const save=()=>{try{localStorage.setItem('fincasa',JSON.stringify(S))}catch(e){}};S.bud=S.bud||{};S.hide=S.hide||{};
let tab='report',month='',q='',fc='',pend=null,accF='*',pFrom='',pTo='';
const TX=()=>S.tx.filter(t=>accF=='*'||t.acc==accF);
const inP=t=>month=='*c'?(t.o>=pFrom&&t.o<=(pTo||'9')):t.o.slice(0,7)==month;
const fd=s=>s?s.split('-').reverse().join('/'):'…';
const PL=m=>m=='*c'?fd(pFrom)+' – '+fd(pTo):ML(m);
const dAdd=(s,n)=>{const x=new Date(s+'T12:00:00');if(isNaN(x)||isNaN(n))return'';x.setDate(x.getDate()+n);return isNaN(x)?'':iso(x.getFullYear(),x.getMonth()+1,x.getDate())};
const dDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)+1;
const grp=c=>S.hide[c]?EXC:(S.cats.find(x=>x.n==c)||{g:VAR}).g;
function catOf(t){if(S.ov[t.id]&&S.cats.some(c=>c.n==S.ov[t.id]))return S.ov[t.id];
 const s=t.a<0?'-':'+',n=norm(t.t);
 for(const r of S.rules)if(r.s==s&&S.cats.some(c=>c.n==r.c)&&n.includes(norm(r.k)))return r.c;
 return t.a<0?'Extra':'Altre entrate'}
/* ---------- PDF ---------- */
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function readPdf(f){
 const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,lines=[];
 for(let p=1;p<=pdf.numPages;p++){
  const tc=await(await pdf.getPage(p)).getTextContent(),rows=[];
  for(const it of tc.items){if(!it.str)continue;const y=it.transform[5];
   let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,i:[]};rows.push(r)}r.i.push({x:it.transform[4],w:it.width,s:it.str})}
  rows.sort((a,b)=>b.y-a.y);
  for(const r of rows){r.i.sort((a,b)=>a.x-b.x);let s='',e=null;
   for(const i of r.i){if(e!==null&&i.x-e>1.5&&!s.endsWith(' ')&&!i.s.startsWith(' '))s+=' ';s+=i.s;e=i.x+i.w}
   s=s.replace(/\s+/g,' ').trim();if(s)lines.push(s)}}
 return lines}
const AMT=/(-?\d{1,3}(?:\.\d{3})*,\d{2})\s*€\s*$/,DR=new RegExp('^(\\d{1,2}) ('+MESI.join('|')+')$','i');
function parseStatement(lines){
 const head=lines.slice(0,30).join(' '),m=head.match(/IBAN\s+IT\s*(\d{2})\s*([A-Z])\s*(\d{5})\s*(\d{5})\s*(\d{12})/);
 const acc=m?'IT'+m.slice(1).join(''):((head.match(/Conto Corrente\s*:\s*(\d+)/)||[])[1]||'conto');
 const hi=lines.findIndex(l=>/^Conto Corrente/.test(l)),holder=hi>=0?(lines[hi+1]||''):'';
 let cur=null,buf=[],items=[],stop=false;
 for(const l of lines){
  if(/^TOTALE/i.test(l)){stop=true;continue}
  if(stop||/^I contenuti di questa pagina|^UniCredit S\.p\.A|^Albo dei Gruppi|^\d{1,3}$/.test(l))continue;
  const d=l.match(DR);if(d){cur={d:+d[1],m:MESI.indexOf(d[2].toLowerCase())+1};buf=[];continue}
  if(!cur)continue;const a=l.match(AMT);
  if(a){const t=(buf.join(' ')+' '+l.slice(0,a.index)).trim();buf=[];
   const v=parseFloat(a[1].replace(/\./g,'').replace(',','.'));if(v)items.push({cur,t,a:v})}
  else buf.push(l)}
 const ym=items.map(i=>i.t.match(/\d{2}[\/.]\d{2}[\/.](20\d{2})/)).find(Boolean);
 const Y=ym?+ym[1]:new Date().getFullYear(),M0=items.length?items[0].cur.m:12,seen={};
 const tx=items.map(i=>{const y=i.cur.m>M0?Y-1:Y;let o=iso(y,i.cur.m,i.cur.d);
  const od=/^PAGAMENTO/i.test(i.t)&&i.t.match(/del (\d{2})\/(\d{2})\/(\d{4})/i);if(od)o=iso(od[3],od[2],od[1]);
  const k=acc+o+i.a+norm(i.t);seen[k]=(seen[k]||0)+1;
  return{id:hash(k)+'-'+seen[k],acc,d:iso(y,i.cur.m,i.cur.d),o,a:i.a,t:i.t}});
 return{acc,holder,tx}}
function parseCsv(txt,name){
 const ls=txt.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim()),h0=ls[0]||'',dl=h0.includes(';')?';':h0.includes('\t')?'\t':',';
 const sp=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch==dl&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())};
 const R=ls.map(sp),hi=R.findIndex(r=>r.some(c=>/^(data|date)/i.test(c))&&r.some(c=>/import|amount|dare|avere|uscit|entrat/i.test(c)));
 if(hi<0)throw new Error('intestazioni CSV non riconosciute (servono Data, Descrizione, Importo)');
 const H=R[hi],f=re=>H.findIndex(c=>re.test(c)),id=f(/^(data|date)/i),ie=f(/descri|causale|operazione|dettagli|details|memo/i),ia=f(/^(importo|amount|valore)/i),ix=f(/dare|uscit|addebit/i),iv=f(/avere|entrat|accredit/i);
 const num=s=>{s=(s||'').replace(/[€\s]/g,'');if(!s)return 0;const c=s.lastIndexOf(','),p=s.lastIndexOf('.');s=c>p?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');return parseFloat(s)||0};
 const dt=s=>{let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return iso(m[1],m[2],m[3]);m=s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);return m?iso(m[3].length==2?'20'+m[3]:m[3],m[2],m[1]):null};
 const base=name.replace(/\.csv$/i,''),acc='csv-'+norm(base),seen={},tx=[];
 for(const r of R.slice(hi+1)){const d=dt(r[id]||'');if(!d)continue;
  const a=ia>=0?num(r[ia]):num(r[iv])-Math.abs(num(r[ix]));if(!a)continue;
  const t=ie>=0?r[ie]:r.filter((_,i)=>i!=id).join(' '),k=acc+d+a+norm(t);seen[k]=(seen[k]||0)+1;
  tx.push({id:hash(k)+'-'+seen[k],acc,d,o:d,a,t})}

async function addFiles(fs){const st=$('#st');let add=0,dup=0;

   if(!p.tx.length){st.textContent='Nessun movimento trovato in '+f.name;continue}
   S.accs[p.acc]=S.accs[p.acc]||p.label||('Conto …'+p.acc.slice(-4)+(p.holder?' · '+p.holder:''));
   const have=new Set(S.tx.map(t=>t.id));
   for(const t of p.tx){if(have.has(t.id))dup++;else{S.tx.push(t);add++}}
  }catch(e){st.textContent='Errore su '+f.name+': '+e.message;return}}

/* ---------- calcoli ---------- */
function sum(m,a=pFrom,b=pTo){const ok=m=='*c'?(t=>t.o>=a&&t.o<=(b||'9')):(t=>t.o.slice(0,7)==m);const r={inc:0,out:0,by:{},n:{}};

  if(g==INC)r.inc+=t.a;else{r.out-=t.a;r.by[c]=(r.by[c]||0)-t.a;r.n[c]=(r.n[c]||0)+1}}

 ({report:rReport,mov:rMov,cat:rCat,data:rData})[tab](ms)}
const PAL=['#2a8a72','#d98e2b','#4a7bd0','#c2546b','#8a6bc4','#5fa8b8','#a3a33a','#c27a4a','#8b9490'];
const bs=(v,l)=>!l?'<span class="mu">–</span>':v>l?'<span class="neg">sforato di '+eur(v-l)+'</span>':'<span class="pos">restano '+eur(l-v)+'</span>';
function charts(r,ms,lc){
 let e=Object.entries(r.by).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 if(e.length>8){const o=e.slice(8).reduce((s,x)=>s+x[1],0);e=e.slice(0,8);e.push(['Altre',o])}
 const tot=e.reduce((s,x)=>s+x[1],0),C=2*Math.PI*70;let ac=0,seg='';
 e.forEach((x,i)=>{const l=x[1]/tot*C;seg+='<circle r="70" cx="100" cy="100" fill="none" stroke="'+PAL[i]+'" stroke-width="28" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-ac)+'" transform="rotate(-90 100 100)"/>';ac+=l});
 const leg=e.map((x,i)=>'<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+PAL[i]+';margin-right:6px"></span>'+esc(x[0])+' <span class="mu">'+Math.round(x[1]/tot*100)+'% · '+eur(x[1])+'</span></div>').join('');
 const T=ms.slice(0,6).reverse().map(m=>({m,...sum(m)})),mx=Math.max(1,...T.flatMap(t=>[t.inc,t.out]));

 const bb=lc.map(c=>{const v=r.by[c.n]||0,l=S.bud[c.n],p=v/l;return '<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>'+esc(c.n)+'</span><span class="'+(p>1?'neg':'mu')+'">'+eur(v)+' / '+eur(l)+' ('+Math.round(p*100)+'%)</span></div><div style="height:8px;background:var(--ln);border-radius:4px"><div style="height:8px;border-radius:4px;width:'+Math.min(100,p*100)+'%;background:'+(p>1?'var(--neg)':p>.85?'#d98e2b':'var(--bar)')+'"></div></div></div>'}).join('');
 return '<div class="ch"><div class="card"><h2>Ripartizione delle spese</h2><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 200 200" width="170">'+seg+'<text x="100" y="105" text-anchor="middle" font-size="16" font-weight="600" style="fill:var(--tx)">'+eur(tot)+'</text></svg><div style="font-size:13px;flex:1;min-width:150px">'+leg+'</div></div></div><div class="card"><h2>Ultimi mesi</h2><svg viewBox="0 0 330 150" width="100%">'+tr+'</svg><div class="mu"><span class="pos">■</span> entrate &nbsp;<span class="neg">■</span> uscite</div></div></div>'+(lc.length?'<div class="card"><h2>Limiti di spesa</h2>'+bb+'</div>':'')}
function rReport(ms){
 const A=$('#app');if(!month){A.innerHTML='<div class="card mu">Nessun dato: carica uno o più estratti conto in PDF per generare il report.</div>';return}
 const cu=month=='*c',pl=cu?dDiff(pFrom,pTo):1,pt2=cu?dAdd(pFrom,-1):'',pm=cu?'x':ms[ms.indexOf(month)+1],r=sum(month),p=cu?(pt2?sum('*c',dAdd(pt2,1-pl),pt2):null):pm?sum(pm):null,max=Math.max(1,...Object.values(r.by)),lc=S.cats.filter(c=>S.bud[c.n]&&grp(c.n)!=INC&&grp(c.n)!=EXC),L=lc.reduce((s,c)=>s+S.bud[c.n],0),Sp=lc.reduce((s,c)=>s+(r.by[c.n]||0),0);
 let h='<div class="pr"><h1>Report spese – '+PL(month)+'</h1><p class="mu">'+(accF=='*'?'Tutti i conti':esc(S.accs[accF]||''))+'</p></div><div class="k"><div><span>Entrate</span><b class="pos">'+eur(r.inc)+'</b></div><div><span>Uscite</span><b class="neg">'+eur(r.out)+'</b><span>'+(p?dlt(r.out,p.out)+' vs '+(cu?'periodo prec.':ML(pm)):'')+'</span></div><div><span>Saldo del mese</span><b>'+eur(r.inc-r.out)+'</b></div>'+(L?'<div><span>Rispetto ai limiti ('+lc.length+' cat.)</span><b class="'+(Sp>L?'neg':'pos')+'">'+(Sp>L?eur(Sp-L)+' sforati':eur(L-Sp)+' risparmiati')+'</b></div>':'')+'</div>';
 h+=(Object.keys(S.hide).length?'<p class="mu">Escluse dal report: '+esc(Object.keys(S.hide).join(', '))+'</p>':'')+charts(r,ms,lc)+'<div class="card"><h2>Spese per categoria – '+PL(month)+'</h2><div class="tw"><table><tr><th>Categoria</th><th style="width:34%"></th><th class="r">Importo</th><th class="r">%</th><th class="r">vs mese prec.</th><th class="r">Limite</th></tr>';
 const gs=[...new Set(S.cats.map(c=>c.g))].filter(g=>g!=INC&&g!=EXC);
 for(const g of gs){const cs=S.cats.filter(c=>c.g==g&&!S.hide[c.n]),tot=cs.reduce((s,c)=>s+(r.by[c.n]||0),0),pt=p?cs.reduce((s,c)=>s+(p.by[c.n]||0),0):null;
  h+='<tr class="g"><td colspan="2">'+esc(g)+'</td><td class="r">'+eur(tot)+'</td><td class="r">'+(r.out>0?Math.round(tot/r.out*100):0)+'%</td><td class="r">'+dlt(tot,pt)+'</td><td class="r">'+bs(tot,cs.reduce((s,c)=>s+(S.bud[c.n]||0),0))+'</td></tr>';
  for(const c of cs){const v=r.by[c.n]||0;
   h+='<tr class="'+(v?'':'z')+'"><td>'+esc(c.n)+(r.n[c.n]?' <span class="mu">('+r.n[c.n]+')</span>':'')+'</td><td><div class="bar" style="width:'+Math.max(0,v/max*100)+'%'+(S.bud[c.n]&&v>S.bud[c.n]?';background:var(--neg)':'')+'"></div></td><td class="r">'+eur(v)+'</td><td class="r">'+(r.out>0?Math.round(v/r.out*100):0)+'%</td><td class="r">'+dlt(v,p?(p.by[c.n]||0):null)+'</td><td class="r">'+bs(v,S.bud[c.n]||0)+'</td></tr>'}}
 h+='</table></div></div>';
 const mt=TX().filter(inP),top=mt.filter(t=>t.a<0&&grp(catOf(t))!=EXC&&grp(catOf(t))!=INC).sort((a,b)=>a.a-b.a).slice(0,5);
 h+='<div class="card"><h2>Le 5 spese più alte</h2><div class="tw"><table>'+top.map(t=>'<tr><td class="mu">'+t.o.slice(8)+'/'+t.o.slice(5,7)+'</td><td>'+esc(t.t.slice(0,80))+'</td><td>'+esc(catOf(t))+'</td><td class="r neg">'+eur(t.a)+'</td></tr>').join('')+'</table></div></div>';
 const ins=mt.filter(t=>grp(catOf(t))==INC);
 h+='<div class="card"><h2>Entrate</h2><div class="tw"><table>'+(ins.map(t=>'<tr><td class="mu">'+t.o.slice(8)+'/'+t.o.slice(5,7)+'</td><td>'+esc(t.t.slice(0,80))+'</td><td>'+esc(catOf(t))+'</td><td class="r pos">'+eur(t.a)+'</td></tr>').join('')||'<tr><td class="mu">Nessuna entrata</td></tr>')+'</table></div></div>';
 const ac={};mt.forEach(t=>{if(grp(catOf(t))==EXC)return;const x=ac[t.acc]=ac[t.acc]||{i:0,o:0};t.a>0?x.i+=t.a:x.o-=t.a});
 h+='<div class="card"><h2>Per conto</h2><div class="tw"><table><tr><th>Conto</th><th class="r">Entrate</th><th class="r">Uscite</th></tr>'+Object.entries(ac).map(([k,v])=>'<tr><td>'+esc(S.accs[k]||k)+'</td><td class="r pos">'+eur(v.i)+'</td><td class="r neg">'+eur(v.o)+'</td></tr>').join('')+'</table></div></div>';
 A.innerHTML=h}
const catOpts=sel=>[...new Set(S.cats.map(c=>c.g))].map(g=>'<optgroup label="'+esc(g)+'">'+S.cats.filter(c=>c.g==g).map(c=>'<option'+(c.n==sel?' selected':'')+'>'+esc(c.n)+'</option>').join('')+'</optgroup>').join('');
function rMov(){
 $('#app').innerHTML='<div class="card"><div class="row noprint"><input id="q" placeholder="Cerca…" value="'+esc(q)+'"><select id="fc"><option value="">Tutte le categorie</option>'+catOpts(fc)+'</select></div><div class="tw"><table><tr><th>Data</th><th>Descrizione</th><th>Categoria</th><th class="r">Importo</th></tr><tbody id="tb"></tbody></table></div></div>';
 $('#q').oninput=e=>{q=e.target.value;fill()};$('#fc').onchange=e=>{fc=e.target.value;fill()};fill()}
function fill(){
 const nq=norm(q),L=TX().filter(t=>inP(t)&&(!nq||norm(t.t).includes(nq))&&(!fc||catOf(t)==fc)).sort((a,b)=>b.o.localeCompare(a.o));
 $('#tb').innerHTML=L.map(t=>'<tr><td class="mu">'+t.o.slice(8)+'/'+t.o.slice(5,7)+'</td><td title="'+esc(t.t)+'">'+esc(t.t.slice(0,90))+'<div class="mu">'+esc(S.accs[t.acc]||'')+'</div></td><td><select data-a="setcat" data-id="'+t.id+'">'+catOpts(catOf(t))+'</select>'+(S.ov[t.id]?' <button class="x" data-a="unov" data-id="'+t.id+'" title="Torna alla categoria automatica">↺</button>':'')+'</td><td class="r '+(t.a<0?'neg':'pos')+'">'+eur(t.a)+'</td></tr>').join('')||'<tr><td class="mu">Nessun movimento</td></tr>'}
function rCat(){
 const gs=[...new Set(S.cats.map(c=>c.g))];
 let h='<div class="card"><h2>Categorie</h2>'+gs.map(g=>'<p><b>'+esc(g)+'</b><br>'+S.cats.filter(c=>c.g==g).map(c=>'<span style="display:inline-block;margin:3px 6px 3px 0;padding:3px 4px 3px 10px;border:1px solid var(--ln);border-radius:20px">'+esc(c.n)+' <button class="x" data-a="delcat" data-n="'+esc(c.n)+'">×</button></span>').join('')+'<br class="noprint"><input class="gn noprint" data-g="'+esc(g)+'" placeholder="+ nuova in questo gruppo" size="22"> <button class="noprint" data-a="addcatg" data-g="'+esc(g)+'">Aggiungi</button></p>').join('')+
 '<div class="row"><input id="nc" placeholder="Nuova categoria"><input id="ng" list="gl" placeholder="Gruppo" value="'+VAR+'"><datalist id="gl">'+gs.map(g=>'<option value="'+esc(g)+'">').join('')+'</datalist><button class="p" data-a="addcat">Aggiungi</button></div><p class="mu">I gruppi «'+INC+'» contano come entrate; «'+EXC+'» è escluso dal report (utile per giroconti tra i tuoi conti).</p></div>';
 h+='<div class="card"><h2>Escludi dal report</h2><p class="mu">Le categorie spuntate non compaiono nel report, nei grafici, nei totali e nei limiti (i movimenti restano visibili in «Movimenti»). Utile per giroconti o voci che non vuoi conteggiare.</p>'+S.cats.filter(c=>c.g!=EXC).map(c=>'<label style="display:inline-block;margin:4px 14px 4px 0"><input type="checkbox" data-a="hide" data-n="'+esc(c.n)+'"'+(S.hide[c.n]?' checked':'')+'> '+esc(c.n)+'</label>').join('')+'</div>';
 h+='<div class="card"><h2>Limiti mensili per categoria</h2><p class="mu">Imposta quanto vuoi spendere al massimo ogni mese: il report mostra quanto resta o di quanto hai sforato. Lascia vuoto per nessun limite.</p><div class="tw"><table>'+S.cats.filter(c=>c.g!=EXC&&c.g!=INC).map(c=>'<tr><td>'+esc(c.n)+'</td><td class="mu">'+esc(c.g)+'</td><td class="r"><input type="number" min="0" step="1" style="width:110px" data-a="bud" data-n="'+esc(c.n)+'" value="'+(S.bud[c.n]||'')+'"> €</td></tr>').join('')+'</table></div></div>';
 h+='<div class="card"><h2>Regole automatiche</h2><p class="mu">Se la descrizione contiene la parola chiave (maiuscole e spazi ignorati), la voce va nella categoria. Le regole in cima hanno la precedenza; le modifiche manuali ai singoli movimenti vincono sempre.</p><div class="row"><input id="rk" placeholder="Parola chiave"><select id="rs"><option value="-">Uscita</option><option value="+">Entrata</option></select><select id="rc">'+catOpts('')+'</select><button class="p" data-a="addrule">Aggiungi regola</button></div><div class="tw"><table>'+S.rules.map((r,i)=>'<tr><td>'+esc(r.k)+'</td><td class="mu">'+(r.s=='-'?'uscita':'entrata')+'</td><td><select data-a="rulecat" data-i="'+i+'">'+catOpts(r.c)+'</select></td><td><button class="x" data-a="delrule" data-i="'+i+'">×</button></td></tr>').join('')+'</table></div></div>';

function rData(){
 $('#app').innerHTML='<div class="card"><h2>Conti caricati</h2><table>'+(Object.entries(S.accs).map(([k,v])=>'<tr><td>'+esc(v)+'<div class="mu">'+esc(k)+'</div></td><td class="mu">'+S.tx.filter(t=>t.acc==k).length+' movimenti</td><td><button class="x" data-a="delacc" data-id="'+esc(k)+'">Rimuovi</button></td></tr>').join('')||'<tr><td class="mu">Nessun conto</td></tr>')+'</table></div><div class="card"><h2>Backup</h2><p class="mu">I dati restano solo in questo browser. Esporta un backup per non perderli o per usarli su un altro dispositivo.</p><div class="row"><button class="p" data-a="exp">Esporta backup (JSON)</button><button data-a="imp">Importa backup</button><button class="p" onclick="exportAll()">Esporta tutto (3 app)</button><button onclick="importAll()">Importa tutto</button><input type="file" id="ij" accept=".json" hidden><button class="x" data-a="reset">Cancella tutto</button></div></div>'}
/* ---------- eventi ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]');if(t&&t.classList.contains('tab')){tab=t.dataset.t;render();return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;
 if(a=='unov'){delete S.ov[d.id];save();render()}
 else if(a=='delcat'){if(S.cats.length<2)return;S.cats=S.cats.filter(c=>c.n!=d.n);S.rules=S.rules.filter(r=>r.c!=d.n);for(const k in S.ov)if(S.ov[k]==d.n)delete S.ov[k];save();render()}
 else if(a=='addcat'){const n=$('#nc').value.trim(),g=$('#ng').value.trim()||VAR;if(n&&!S.cats.some(c=>c.n==n)){S.cats.push({n,g});save();render()}}
 else if(a=='addcatg'){const i=document.querySelector('input.gn[data-g="'+CSS.escape(d.g)+'"]'),n=i.value.trim();if(n&&!S.cats.some(c=>c.n==n)){S.cats.push({n,g:d.g});save();render()}}
 else if(a=='addrule'){const k=$('#rk').value.trim();if(k){S.rules.unshift({k,c:$('#rc').value,s:$('#rs').value});save();render()}}
 else if(a=='delrule'){S.rules.splice(+d.i,1);save();render()}
 else if(a=='delacc'){if(confirm('Rimuovere il conto e i suoi movimenti?')){delete S.accs[d.id];S.tx=S.tx.filter(t=>t.acc!=d.id);save();render()}}
 else if(a=='reset'){if(confirm('Cancellare tutti i dati, categorie e regole?')){S=DEF();save();render()}}
 else if(a=='exp'){saveJson(JSON.stringify(S,null,2),'finanze-casa-backup.json')}
 else if(a=='imp')$('#ij').click();
 else if(a=='dOne'){S.ov[pend.id]=pend.c;save();$('#dlg').close();render()}
 else if(a=='dRule'){const k=$('#dkw').value.trim(),t=S.tx.find(x=>x.id==pend.id);if(k){S.rules.unshift({k,c:pend.c,s:t.a<0?'-':'+'});delete S.ov[pend.id]}else S.ov[pend.id]=pend.c;save();$('#dlg').close();render()}
 else if(a=='dNo'){$('#dlg').close();render()}});
document.addEventListener('change',e=>{const s=e.target,a=s.dataset.a;
 if(a=='setcat'){const t=S.tx.find(x=>x.id==s.dataset.id);pend={id:t.id,c:s.value};
  const m=t.t.match(/DI EUR [\d.,]+ (.+)$/),g=m?m[1].split(' ').slice(0,2).join(' '):'';
  $('#dtx').textContent=t.t.slice(0,110);$('#dkw').value=g;$('#dlg').showModal()}
 else if(a=='rulecat'){S.rules[+s.dataset.i].c=s.value;save()}
 else if(a=='bud'){const v=parseFloat(s.value);if(v>0)S.bud[s.dataset.n]=v;else delete S.bud[s.dataset.n];save()}
 else if(s.id=='accsel'){accF=s.value;render()}
 else if(a=='hide'){if(s.checked)S.hide[s.dataset.n]=1;else delete S.hide[s.dataset.n];save()}
 else if(s.id=='pf'||s.id=='pt'){if(s.id=='pf')pFrom=s.value;else pTo=s.value;render()}
 else if(s.id=='month'){month=s.value;render()}
 else if(s.id=='ij'){const f=s.files[0];if(!f)return;f.text().then(x=>{try{const j=JSON.parse(x);if(!j.tx||!j.cats)throw 0;S=j;S.bud=S.bud||{};S.hide=S.hide||{};save();render()}catch(_){alert('File di backup non valido')}})}});
$('#month').onchange=e=>{month=e.target.value;render()};
$('#prt').onclick=()=>window.print();
const dz=$('#drop');dz.onclick=()=>$('#file').click();
$('#file').onchange=e=>addFiles([...e.target.files]);
dz.ondragover=e=>{e.preventDefault();dz.classList.add('hv')};dz.ondragleave=()=>dz.classList.remove('hv');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('hv');addFiles([...e.dataTransfer.files].filter(f=>/\.(pdf|csv)$/i.test(f.name)))};
render();
